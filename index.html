<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-ui: 'Montserrat', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
      --font-size-base: 14px;
      --font-size-xs: calc(var(--font-size-base) * 0.79);
      --font-size-sm: calc(var(--font-size-base) * 0.91);
      --font-size-lg: calc(var(--font-size-base) * 1.28);
      --font-size-xl: calc(var(--font-size-base) * 1.65);

      --bg-main: #F4F5F9;
      --bg-panel: #FFFFFF;
      --bg-panel-sunken: #F8F9FC;
      --border: #E1E4EC;
      --border-strong: #C9CEDA;
      --text-main: #10151F;
      --text-muted: #626B7C;
      --brand: #2784f5;
      --brand-deep: #1b65c4;
      --brand-soft: rgba(39, 132, 245, 0.12);
      --mint: #0E9F76;
      --danger: #D64545;
      
      --shadow-card: 0 8px 24px -4px rgba(0, 0, 0, 0.08);
      --shadow-hover: 0 12px 28px -6px rgba(0, 0, 0, 0.12);
    }

    html.dark {
      --bg-main: #050505;
      --bg-panel: #121212;
      --bg-panel-sunken: #000000;
      --border: #222222;
      --border-strong: #333333;
      --text-main: #FFFFFF;
      --text-muted: #FFFFFF;
      --brand: #2784f5;
      --brand-deep: #5b9ff8;
      --brand-soft: rgba(39, 132, 245, 0.14);
      --mint: #2FC495;
      --danger: #E5726F;
      --shadow-card: 0 8px 24px -4px rgba(0, 0, 0, 0.6);
      --shadow-hover: 0 12px 28px -6px rgba(0, 0, 0, 0.8);
    }

    * {
      font-family: var(--font-ui) !important;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    .font-mono { font-family: var(--font-mono) !important; }

    html, body {
      font-size: var(--font-size-base);
      background-color: var(--bg-main);
      color: var(--text-main);
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Una sola zona de scroll adaptada al iframe */
    #pantalla-login, #pantalla-lista, #pantalla-formulario {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    ::-webkit-scrollbar { 
      display: none; 
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

    .ledger-bg {
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 28px 28px;
      background-position: center;
      opacity: 0.5;
    }

    .classic-input {
      background-color: var(--bg-panel-sunken);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: var(--font-size-sm);
      padding: 14px 16px;
      border-radius: 10px;
      outline: none;
      width: 100%;
      transition: all 0.2s ease;
    }
    .classic-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); background-color: var(--bg-panel); }

    .image-box {
      position: relative;
      border: 1.5px dashed var(--border-strong);
      border-radius: 12px;
      height: 110px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      background: var(--bg-panel-sunken);
      transition: all 0.2s ease;
      overflow: hidden;
    }
    .image-box:hover { border-color: var(--brand); background: var(--brand-soft); transform: translateY(-2px); }
    .image-box img { width: 100%; height: 100%; object-fit: contain; display: none; }
    .image-box .doc-name { display: none; text-align: center; padding: 10px; font-size: var(--font-size-xs); color: var(--mint); font-weight: 600; word-break: break-all; }
    input[type="file"] { display: none; }

    .dyn-xs { font-size: var(--font-size-xs); }
    .dyn-sm { font-size: var(--font-size-sm); }
    .dyn-base { font-size: var(--font-size-base); }
    .dyn-lg { font-size: var(--font-size-lg); }
    .dyn-xl { font-size: var(--font-size-xl); }

    .required-dot { color: var(--brand); font-size: 8px; vertical-align: 2px; margin-left: 2px; }

    .btn-primary {
      background: linear-gradient(145deg, var(--brand), var(--brand-deep));
      color: #fff;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(39, 132, 245, 0.25);
    }
    .btn-primary:hover { box-shadow: 0 6px 16px rgba(39, 132, 245, 0.4); transform: translateY(-1px); }
    .btn-primary:active { transform: scale(0.98); }

    .icon-btn {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 10px;
      color: rgba(255,255,255,0.9);
      transition: background-color 0.15s;
    }
    .icon-btn:hover { background-color: rgba(255,255,255,0.15); }

    #loader {
      display: none; position: fixed; inset: 0; background: rgba(5, 5, 5, 0.85);
      z-index: 3000; justify-content: center; align-items: center; flex-direction: column; backdrop-filter: blur(5px);
    }
    .spinner {
      border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--brand);
      border-radius: 50%; width: 40px; height: 40px; animation: spin 0.8s linear infinite; margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .doc-card { background-color: var(--bg-panel); border: 1px solid transparent; border-radius: 16px; box-shadow: var(--shadow-card); transition: all 0.2s ease; }
    .doc-card:hover { border-color: var(--border); box-shadow: var(--shadow-hover); transform: translateY(-2px); }

    .thumb { background-color: var(--bg-panel-sunken); border: 1px solid var(--border); border-radius: 10px; transition: all 0.2s ease; }
    .thumb:hover { border-color: var(--brand); transform: scale(1.03); box-shadow: 0 4px 8px var(--brand-soft); }

    .glass-header { background: rgba(27, 101, 196, 0.95); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    html.dark .glass-header { background: rgba(5, 5, 5, 0.95); border-bottom: 1px solid var(--border); }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: '#2784f5' } } } }
  </script>
</head>
<body class="antialiased selection:bg-blue-500 selection:text-white">

  <div id="loader">
    <div class="spinner"></div>
    <div class="dyn-sm font-mono font-medium" style="color:#EAF0FF; letter-spacing: 0.5px;">Procesando…</div>

<!-- PANEL LATERAL (SIDEBAR) -->

  <div id="sidebar" class="fixed top-0 left-0 h-full w-[260px] shadow-2xl z-[2001] transform -translate-x-full transition-transform duration-300 flex flex-col border-r"
       style="background-color: var(--bg-panel); border-color: var(--border);">
    <div class="flex-1 overflow-y-auto">

      </div>

  <!-- PANTALLA 1: LOGIN -->

<!-- Agrega pb-32 (padding-bottom) para empujar el cuadro hacia arriba. Si quieres bajarlo, usa pt-32 (padding-top) -->
  <div id="pantalla-login" class="relative flex min-h-screen flex-col justify-center items-center p-4 pb-32 overflow-hidden">
    <div class="ledger-bg absolute inset-0 pointer-events-none"></div>
    <div class="relative rounded-3xl p-8 w-full max-w-[340px] flex flex-col gap-8 shadow-2xl z-10"
         style="background-color: var(--bg-panel);">
      <div class="flex flex-col items-center text-center">
        <!-- AQUÍ PEGAS TU BASE64 DESPUÉS DE LA COMA -->
        <img alt="Logo GoodCont" class="logo-app h-[180px] w-auto object-contain mb-3 drop-shadow-sm">
        <div class="text-[11px] mt-1 font-bold tracking-widest uppercase" style="color: var(--text-muted);">Te cuidamos la espalda</div>

  <!-- PANTALLA 2: GALERÍA -->
    <div id="pantalla-lista" class="hidden fixed inset-0 w-full h-full pt-28 pb-32 overflow-y-auto" style="background-color: var(--bg-main); -webkit-overflow-scrolling: touch;">

          <button class="icon-btn text-2xl text-white" onclick="toggleMenu()">☰</button>
          <div class="text-white font-bold dyn-base tracking-widest uppercase">Documentos</div>

      </div>
    </div>

    <div id="contenedor-historial" class="max-w-2xl mx-auto px-4 flex flex-col gap-4">

    <!-- Botón + Centrado Fijo Abajo -->

         style="background-color: var(--bg-panel); border-color: var(--border);">
      <div class="opacity-40 font-semibold tracking-widest uppercase" style="color: var(--text-muted); font-size: 10px;">

      </div>

  <!-- PANTALLA 3: FORMULARIO -->
  <div id="pantalla-formulario" class="hidden pt-20 pb-20 min-h-screen w-full" style="background-color: var(--bg-main);">
    <div class="h-16 flex items-center justify-between px-4 shadow-md fixed top-0 w-full z-50 glass-header">
      <div id="titulo-formulario" class="text-white font-black tracking-widest dyn-base uppercase drop-shadow-sm flex items-center gap-2">📄 Nuevo</div>
      <div class="flex items-center gap-2">
        <button type="button" class="dyn-xs font-semibold tracking-widest uppercase transition-colors text-white bg-white/10 hover:bg-white/20 px-3 py-2.5 rounded-lg border border-white/20" onclick="cerrarFormulario()">Cancelar</button>
        <button type="button" id="btn-enviar" class="btn-primary dyn-xs font-bold tracking-wide uppercase px-5 py-2.5 rounded-lg shadow-md" onclick="enviarFormulario()">Guardar</button>
      </div>

    <form id="form-archivos" class="max-w-2xl mx-auto px-4 flex flex-col gap-6">
      <input type="hidden" id="id-edicion" name="idEdicion" value="">
      <div class="hidden flex-col gap-2 p-4 rounded-2xl mt-4 shadow-sm" style="background-color: var(--bg-panel);">
        <label class="dyn-xs font-bold tracking-wide uppercase" style="color: var(--text-muted);">Empresa vinculada <span class="required-dot">●</span></label>
        <select id="select-ruc-form" name="ruc" class="classic-input font-mono dyn-sm font-semibold" onchange="sincronizarSelects(this.value)"></select>
      </div>

      <script>
        function crearCampoArchivo(id, label, requerido) {
          document.write(`
            <div class="form-group flex flex-col gap-2">
              <label class="dyn-xs font-bold uppercase tracking-wide" style="color: var(--text-main);">${label}${requerido ? ' <span class="required-dot">●</span>' : ''}</label>
              <div class="image-box" id="box-${id}" data-url="" onclick="gestionarClickArchivo('${id}')">
                <div class="icon-container flex flex-col items-center" id="icon-${id}">
                  <div style="font-size: 24px;">📎</div>
                  <div class="dyn-xs mt-1 font-medium" style="color: var(--text-muted);">Adjuntar</div>
                </div>
                <img id="img-${id}">
                <div class="doc-name" id="doc-${id}"></div>
              </div>
              <input type="file" id="${id}" name="${id}"
                     accept="image/*,application/pdf,.xlsx,.xls,.doc,.docx,.csv,.zip"
                     ${requerido ? 'required' : ''}
                     onchange="manejarArchivo(this, '${id}')">
            </div>
          `);
        }
      </script>

      <div class="grid grid-cols-2 gap-4">
        <script>
          crearCampoArchivo('factura', 'Factura', true);
          crearCampoArchivo('voucher', 'Voucher', false);
          crearCampoArchivo('guiaRemision', 'Guía Remisión', false);
          crearCampoArchivo('guiaTransportista', 'Guía Transp.', false);
          crearCampoArchivo('cotizacion', 'Cotización', false);
          crearCampoArchivo('ordenCompra', 'Orden Compra', false);
          crearCampoArchivo('recepcionInventario', 'Rec. Invent.', false);
          crearCampoArchivo('adicional', 'Adicional', false);
        </script>
      </div>
      <!-- Espaciador que ocupa la altura inferior sin romper la cuadrícula -->
      <div class="h-28 w-full"></div>
    </form>

    <!-- Barra Inferior (Pie de Página Formulario) -->
    <div class="fixed bottom-0 left-0 w-full pb-5 pt-4 border-t z-40 flex justify-center items-start pointer-events-none" 
         style="background-color: var(--bg-panel); border-color: var(--border);">
      <div class="opacity-40 font-semibold tracking-widest uppercase" style="color: var(--text-muted); font-size: 10px;">
        &copy; 2026 GOODCONT • DIEGO CALDERÓN
      </div>
    </div>
  </div>

  <script>
    // PEGA AQUÍ EL ENLACE QUE TERMINA EN /exec QUE TE DIO APPS SCRIPT
    const API_URL = 'https://script.google.com/macros/s/AKfycbzTxwsrTFfqObBjDvUdn7I73lNO_p--5ST8_Ri6qku9fW6ETG18Mx0h9SZ-a4UFSti8xA/exec'; 
    const LOGO_BASE64 = '';

    function cargarLogos() {

    function cargarLogos() {
      document.querySelectorAll('.logo-app').forEach(img => {
        img.src = LOGO_BASE64;
      });
    }

    function safeGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
    function safeSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }
    function safeRemove(k) { try { localStorage.removeItem(k); } catch(e) {} }

    function aplicarTemaGuardado() {
      const tema = safeGet('goodContaTema') || 'dark';
      const htmlEl = document.documentElement;
      const btnTheme = document.getElementById('btn-theme');
      const themeText = document.getElementById('theme-text');
      if (tema === 'dark') {
        htmlEl.classList.add('dark');
        if (btnTheme) btnTheme.innerText = '🌙';
        if (themeText) themeText.innerText = 'Modo Claro';
      } else {
        htmlEl.classList.remove('dark');
        if (btnTheme) btnTheme.innerText = '☀️';
        if (themeText) themeText.innerText = 'Modo Oscuro';
      }
    }

    function toggleTema() {
      const htmlEl = document.documentElement;
      const btnTheme = document.getElementById('btn-theme');
      const themeText = document.getElementById('theme-text');
      if (htmlEl.classList.contains('dark')) {
        htmlEl.classList.remove('dark');
        safeSet('goodContaTema', 'light');
        if (btnTheme) btnTheme.innerText = '☀️';
        if (themeText) themeText.innerText = 'Modo Oscuro';
      } else {
        htmlEl.classList.add('dark');
        safeSet('goodContaTema', 'dark');
        if (btnTheme) btnTheme.innerText = '🌙';
        if (themeText) themeText.innerText = 'Modo Claro';
      }
    }

    function toggleMenu() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      if(sidebar.classList.contains('-translate-x-full')) {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
      }
    }

    window.onload = function() {
      cargarLogos(); 
      aplicarTemaGuardado();
      const correoGuardado = safeGet('goodContaEmail');
      if (correoGuardado) {
        document.getElementById('email').value = correoGuardado;
        validarCorreo();
      }
    };

    function cerrarSesion() {
      safeRemove('goodContaEmail');
      document.getElementById('pantalla-lista').classList.add('hidden');
      document.getElementById('pantalla-login').classList.replace('hidden', 'flex');
      document.getElementById('email').value = '';
      document.getElementById('btn-login').innerText = "INGRESAR";
      document.getElementById('btn-login').disabled = false;
    }

    function validarCorreo() {
      const email = document.getElementById('email').value;
      if(!email) return;
      document.getElementById('btn-login').innerText = "VERIFICANDO...";
      document.getElementById('btn-login').disabled = true;
      
      fetch(API_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ accion: 'buscarRucs', correo: email })
      })
      .then(res => res.json())

      .then(res => {
        if (res.exito) iniciarApp(res.datos);
        else throw new Error(res.error);
      })
      .catch(err => {
        alert("Error de conexión: " + err.message);
        document.getElementById('btn-login').innerText = "INGRESAR";
        document.getElementById('btn-login').disabled = false;
      });
    }

    function iniciarApp(rucs) {
      if (rucs && rucs.length > 0) {
        safeSet('goodContaEmail', document.getElementById('email').value);
        document.getElementById('pantalla-login').classList.replace('flex', 'hidden');
        document.getElementById('pantalla-lista').classList.remove('hidden');
        
        document.getElementById('btn-login').innerText = "INGRESAR";
        document.getElementById('btn-login').disabled = false;

        const selLista = document.getElementById('select-ruc-lista');
        const selForm = document.getElementById('select-ruc-form');
        selLista.innerHTML = ''; selForm.innerHTML = '';

        rucs.forEach(empresa => {
          let val = empresa.ruc + " - " + empresa.razonSocial;
          selLista.appendChild(new Option(val, val));
          selForm.appendChild(new Option(val, val));
        });
        actualizarRucYHistorial();
      } else {
        document.getElementById('btn-login').innerText = "INGRESAR";
        document.getElementById('btn-login').disabled = false;
        document.getElementById('error-login').classList.remove('hidden');
      }
    }

    function abrirVisor(url, titulo) {
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (!match) return;
      const fileId = match[1];
      const previewUrl = "https://drive.google.com/file/d/" + fileId + "/preview";
      document.getElementById('modal-titulo').innerText = titulo;
      document.getElementById('modal-contenido').innerHTML = '<iframe src="' + previewUrl + '" allow="autoplay" class="w-full h-full border-none"></iframe>';
      document.getElementById('modal-visor').classList.replace('hidden', 'flex');
    }

    function cerrarVisor() {
      document.getElementById('modal-visor').classList.replace('flex', 'hidden');
      document.getElementById('modal-contenido').innerHTML = '';
    }

    function actualizarRucYHistorial() {
      const rucValor = document.getElementById('select-ruc-lista').value;
      document.getElementById('contenedor-historial').innerHTML = '<div class="text-center mt-20 dyn-sm font-semibold tracking-wide uppercase" style="color: var(--text-muted);">Buscando documentos…</div>';
      
      fetch(API_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ accion: 'obtenerHistorial', ruc: rucValor })
      })
      .then(res => res.json())
      .then(res => {
        if (res.exito) pintarHistorial(res.datos);
        else alert("Error: " + res.error);
      })
      .catch(err => alert("Error de conexión: " + err.message));
    }

    function pintarHistorial(historial) {
      const contenedor = document.getElementById('contenedor-historial');
      if(!historial || historial.length === 0) {
        contenedor.innerHTML = '<div class="text-center mt-20 dyn-sm font-semibold tracking-wide" style="color: var(--text-muted);">Sin registros. Toca “＋” para crear.</div>';
        return;
      }
      let html = '';
      historial.forEach(item => {
        let gridHtml = '';
        for (const [nombreDoc, url] of Object.entries(item.urls)) {
          if (url && url.toString().startsWith('http')) {
            const match = url.toString().match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match) {
              const thumbUrl = "https://lh3.googleusercontent.com/d/" + match[1] + "=s150";
              gridHtml += `
                <div class="thumb flex flex-col items-center p-1.5 cursor-pointer" onclick="abrirVisor('${url}', '${nombreDoc}')">
                  <div class="w-full h-14 rounded-lg flex items-center justify-center overflow-hidden relative" style="background-color: var(--bg-panel);">
                    <img src="${thumbUrl}" class="w-full h-full object-cover" onerror="this.outerHTML='<span class=\\'text-2xl\\'>📄</span>'">
                  </div>
                  <span class="dyn-xs mt-1.5 font-bold text-center w-full truncate px-1" style="color: var(--text-muted);">${nombreDoc}</span>
                </div>`;
            }
          }
        }
        html += `
          <div class="doc-card p-5 flex flex-col">
            <div class="flex justify-between items-center pb-3 mb-4 border-b" style="border-color: var(--border);">
              <span class="font-mono font-bold dyn-base" style="color: var(--brand);">${item.codigo}</span>
              <div class="flex items-center gap-2">
                <span class="dyn-xs font-semibold px-2 py-1 rounded-md" style="background: var(--bg-panel-sunken); color: var(--text-muted);">${item.fecha}</span>
                <button type="button" class="flex justify-center items-center rounded-lg transition-transform hover:scale-105" 
                        style="width: 32px; height: 32px; background-color: var(--brand-soft); color: var(--brand); font-size: 14px;" 
                        onclick="abrirEdicion('${item.codigo}')" title="Modificar Registro">
                  ✏️
                </button>
              </div>
            </div>
            <div class="grid grid-cols-4 gap-3">${gridHtml}</div>
          </div>`;
      });
      contenedor.innerHTML = html;
    }

    function gestionarClickArchivo(id) {
      // Abre el selector de archivos de inmediato para agilizar el reemplazo. 
      // La miniatura seguirá visible hasta que se elija un archivo nuevo.
      document.getElementById(id).click();
    }

    function manejarArchivo(input, id) {
      const box = document.getElementById('box-' + id);
      if (box) box.dataset.url = ""; // Limpia la URL previa si subes algo nuevo
      
      const file = input.files[0];
      const icon = document.getElementById('icon-' + id);
      const img = document.getElementById('img-' + id);
      const doc = document.getElementById('doc-' + id);
      icon.style.display = 'none'; img.style.display = 'none'; doc.style.display = 'none';
      if (file) {
        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = function(e) { img.src = e.target.result; img.style.display = 'block'; };
          reader.readAsDataURL(file);
        } else {
          let docIcon = '📄';
          const name = file.name.toLowerCase();
          if (name.endsWith('.xlsx') || name.endsWith('.xls') || name.endsWith('.csv')) docIcon = '📊';
          else if (name.endsWith('.pdf')) docIcon = '📑';
          else if (name.endsWith('.zip') || name.endsWith('.rar')) docIcon = '📦';
          doc.innerHTML = `<span class="text-2xl">${docIcon}</span><br><strong>${file.name}</strong>`;
          doc.style.display = 'block';
        }
      } else { icon.style.display = 'flex'; }
    }

function abrirFormulario() {
      document.getElementById('id-edicion').value = '';
      document.getElementById('titulo-formulario').innerHTML = '📄 Nuevo';
      document.getElementById('form-archivos').reset();
      document.querySelectorAll('.image-box').forEach(box => box.dataset.url = "");
      document.querySelectorAll('.image-box .icon-container').forEach(el => el.style.display = 'flex');
      document.querySelectorAll('.image-box img').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.image-box .doc-name').forEach(el => el.style.display = 'none');
      
      document.getElementById('pantalla-lista').classList.add('hidden');
      document.getElementById('pantalla-formulario').classList.remove('hidden');
      document.getElementById('pantalla-formulario').scrollTop = 0;
    }

    function cerrarFormulario() {
      document.getElementById('pantalla-formulario').classList.add('hidden');
      document.getElementById('pantalla-lista').classList.remove('hidden');
    }

    function sincronizarSelects(valor) {
      document.getElementById('select-ruc-lista').value = valor;
      document.getElementById('select-ruc-form').value = valor;
    }

    async function enviarFormulario() {
      const form = document.getElementById('form-archivos');
      if(!form.checkValidity()) { form.reportValidity(); return; }
      document.getElementById('loader').style.display = 'flex';
      document.getElementById('btn-enviar').disabled = true;

      const leerBase64 = (file) => new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve({
          nombre: file.name,
          mimeType: file.type,
          base64: reader.result.split(',')[1]
        });
        reader.readAsDataURL(file);
      });

      let payloadForm = { ruc: document.getElementById('select-ruc-form').value };
      const inputsFiles = form.querySelectorAll('input[type="file"]');
      
      for (let input of inputsFiles) {
        if (input.files.length > 0) {
          payloadForm[input.name] = await leerBase64(input.files[0]);
        }
      }

      fetch(API_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ accion: 'procesarSubida', formulario: payloadForm })
      })
      .then(res => res.json())
      .then(res => {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('btn-enviar').disabled = false;
        if (res.exito) {
          form.reset();
          document.querySelectorAll('.image-box .icon-container').forEach(el => el.style.display = 'flex');
          document.querySelectorAll('.image-box img').forEach(el => el.style.display = 'none');
          document.querySelectorAll('.image-box .doc-name').forEach(el => el.style.display = 'none');
          cerrarFormulario();
          actualizarRucYHistorial();
        } else {
          alert("Error: " + res.error);
        }
      })
      .catch(err => {
        alert("Error de conexión: " + err.message);
        document.getElementById('loader').style.display = 'none';
        document.getElementById('btn-enviar').disabled = false;
      });
    }

    function abrirEdicion(codigo) {
      document.getElementById('loader').style.display = 'flex';
      google.script.run
        .withSuccessHandler(function(datos) {
          document.getElementById('loader').style.display = 'none';
          if (datos) {
            document.getElementById('id-edicion').value = codigo;
            document.getElementById('titulo-formulario').innerHTML = '✏️ Editando';
            
            // Rellenar las cajas con los archivos existentes
            for (const [id, url] of Object.entries(datos)) {
              const box = document.getElementById('box-' + id);
              if (!box) continue;
              
              const img = document.getElementById('img-' + id);
              const doc = document.getElementById('doc-' + id);
              const icon = document.getElementById('icon-' + id);
              
              if (url && url !== "") {
                box.dataset.url = url;
                icon.style.display = 'none';
                
                const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match) {
                   img.src = "https://lh3.googleusercontent.com/d/" + match[1] + "=s150";
                   img.style.display = 'block';
                   doc.style.display = 'none';
                } else {
                   doc.innerHTML = `<span class="text-2xl">📄</span><br><strong>Archivo guardado</strong>`;
                   doc.style.display = 'block';
                   img.style.display = 'none';
                }
              } else {
                box.dataset.url = "";
                icon.style.display = 'flex';
                img.style.display = 'none';
                doc.style.display = 'none';
              }
            }

            document.getElementById('pantalla-lista').classList.add('hidden');
            document.getElementById('pantalla-formulario').classList.remove('hidden');
            document.getElementById('pantalla-formulario').scrollTop = 0;
          } else {
            alert("No se encontró el registro.");
          }
        })
        .withFailureHandler(function(error) {
          document.getElementById('loader').style.display = 'none';
          alert("Error: " + error.message);
        })
        .obtenerRegistroPorCodigo(codigo);
    }
  </script>
</body>
